<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Sunflower Bouquet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Georgia', serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            max-width: 90%;
        }

        .question-box h1 {
            color: #e63946;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b6b, #e63946);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(230, 57, 70, 0.6);
        }

        .btn-no {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .btn-no:hover {
            transform: scale(1.05);
        }

        .final-message {
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }

        .final-message h1 {
            color: #ff6b6b;
            font-size: 4rem;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .hearts {
            font-size: 3rem;
            margin: 20px 0;
            animation: float 2s ease-in-out infinite;
        }

        .btn-reset {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .sad-message {
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
        }

        .sad-message h1 {
            color: #aaa;
            font-size: 2rem;
        }

        .sad-message p {
            color: #888;
            margin-top: 10px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 600px) {
            .question-box {
                padding: 25px 30px;
            }
            .question-box h1 {
                font-size: 1.8rem;
            }
            .btn {
                padding: 12px 30px;
                font-size: 1.1rem;
            }
            .final-message h1 {
                font-size: 2.5rem;
            }
            .hearts {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay">
        <div class="question-box" id="questionBox">
            <h1>Will You Be My Valentine?</h1>
            <div class="buttons">
                <button class="btn btn-yes" id="btnYes">Yes!</button>
                <button class="btn btn-no" id="btnNo">No</button>
            </div>
        </div>

        <div class="final-message" id="finalMessage">
            <h1>I LOVE YOU</h1>
            <div class="hearts">💕 💖 💕</div>
            <button class="btn-reset" id="btnReset">Start Over</button>
        </div>

        <div class="sad-message" id="sadMessage">
            <h1>😢</h1>
            <p>Maybe next time...</p>
            <button class="btn-reset" id="btnResetSad">Try Again</button>
        </div>
    </div>

    <script>
        // Audio Context
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playGrowSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.5);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playBloomSound() {
            initAudio();
            const frequencies = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6

            frequencies.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'sine';
                osc.frequency.value = freq;

                const startTime = audioCtx.currentTime + i * 0.1;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.08, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);

                osc.start(startTime);
                osc.stop(startTime + 0.4);
            });
        }

        function playCheerSound() {
            initAudio();
            const chords = [
                [261.63, 329.63, 392.00], // C major
                [293.66, 369.99, 440.00], // D major
                [329.63, 415.30, 493.88], // E major
                [349.23, 440.00, 523.25]  // F major
            ];

            chords.forEach((chord, i) => {
                chord.forEach(freq => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    const startTime = audioCtx.currentTime + i * 0.3;
                    gain.gain.setValueAtTime(0.06, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.25);

                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            });
        }

        function playDodgeSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSadSound() {
            initAudio();
            const frequencies = [293.66, 261.63, 233.08, 196.00]; // Descending

            frequencies.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'sawtooth';
                osc.frequency.value = freq;

                const startTime = audioCtx.currentTime + i * 0.3;
                gain.gain.setValueAtTime(0.05, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.25);

                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
        }

        // Three.js Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xffd700, 0.5);
        pointLight.position.set(-5, 5, 5);
        scene.add(pointLight);

        // Materials
        const stemMaterial = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
        const diskMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const petalMaterial = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            side: THREE.DoubleSide
        });

        // Create petal shape
        function createPetalGeometry() {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.bezierCurveTo(0.3, 0.5, 0.3, 1.2, 0, 1.8);
            shape.bezierCurveTo(-0.3, 1.2, -0.3, 0.5, 0, 0);

            const extrudeSettings = {
                steps: 1,
                depth: 0.05,
                bevelEnabled: false
            };

            return new THREE.ExtrudeGeometry(shape, extrudeSettings);
        }

        const petalGeometry = createPetalGeometry();

        // Create sunflower
        function createSunflower(stemHeight, tiltX, tiltZ, scale) {
            const flower = new THREE.Group();
            flower.userData = {
                stemHeight,
                tiltX,
                tiltZ,
                scale,
                animated: false
            };

            // Stem
            const stemGeometry = new THREE.CylinderGeometry(0.15, 0.2, stemHeight, 8);
            const stem = new THREE.Mesh(stemGeometry, stemMaterial);
            stem.position.y = stemHeight / 2;
            stem.scale.y = 0;
            flower.add(stem);
            flower.userData.stem = stem;

            // Flower head group
            const headGroup = new THREE.Group();
            headGroup.position.y = stemHeight;
            headGroup.rotation.x = tiltX;
            headGroup.rotation.z = tiltZ;
            headGroup.scale.set(0, 0, 0);
            flower.add(headGroup);
            flower.userData.headGroup = headGroup;

            // Brown center disk
            const diskGeometry = new THREE.CylinderGeometry(1.2, 1.2, 0.3, 32);
            const disk = new THREE.Mesh(diskGeometry, diskMaterial);
            disk.rotation.x = Math.PI / 2;
            headGroup.add(disk);

            // Petals group
            const petalGroup = new THREE.Group();
            petalGroup.rotation.x = Math.PI / 2;
            headGroup.add(petalGroup);

            // Create petals
            const petals = [];
            for (let i = 0; i < 20; i++) {
                const angle = (i / 20) * Math.PI * 2;
                const petal = new THREE.Mesh(petalGeometry, petalMaterial);

                // Position at edge of disk
                petal.position.set(
                    Math.cos(angle) * 1.3,
                    Math.sin(angle) * 1.3,
                    0
                );

                // Rotate to point outward (like wheel spokes)
                petal.rotation.z = angle - Math.PI / 2;

                petal.scale.set(0, 0, 0);
                petalGroup.add(petal);
                petals.push(petal);
            }
            flower.userData.petals = petals;

            // Apply overall scale
            flower.scale.set(scale, scale, scale);

            return flower;
        }

        // Bouquet arrangement
        const bouquet = new THREE.Group();
        bouquet.position.y = -5;
        scene.add(bouquet);

        const flowers = [];

        // Center flower
        flowers.push(createSunflower(10, 0, 0, 1.0));

        // Medium ring (4 flowers)
        const mediumRingData = [
            { angle: 0, height: 8.5, tiltX: 0.15, scale: 0.95 },
            { angle: Math.PI / 2, height: 7.5, tiltX: 0.15, scale: 0.9 },
            { angle: Math.PI, height: 8, tiltX: 0.15, scale: 0.92 },
            { angle: 3 * Math.PI / 2, height: 6.5, tiltX: 0.15, scale: 0.88 }
        ];

        mediumRingData.forEach(data => {
            const flower = createSunflower(data.height, data.tiltX, 0, data.scale);
            flower.position.x = Math.cos(data.angle) * 3;
            flower.position.z = Math.sin(data.angle) * 3;
            flower.rotation.y = data.angle;
            flowers.push(flower);
        });

        // Outer ring (5 flowers)
        const outerRingData = [
            { angle: Math.PI / 5, height: 5.8, tiltX: 0.28, scale: 0.85 },
            { angle: 3 * Math.PI / 5, height: 5.2, tiltX: 0.25, scale: 0.78 },
            { angle: Math.PI, height: 4.8, tiltX: 0.3, scale: 0.7 },
            { angle: 7 * Math.PI / 5, height: 5.5, tiltX: 0.27, scale: 0.8 },
            { angle: 9 * Math.PI / 5, height: 5.0, tiltX: 0.26, scale: 0.75 }
        ];

        outerRingData.forEach(data => {
            const flower = createSunflower(data.height, data.tiltX, 0, data.scale);
            flower.position.x = Math.cos(data.angle) * 5.5;
            flower.position.z = Math.sin(data.angle) * 5.5;
            flower.rotation.y = data.angle;
            flowers.push(flower);
        });

        flowers.forEach(flower => bouquet.add(flower));

        // Easing function
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        // Animation
        let animationStartTime = null;
        let isAnimating = false;

        function animateFlower(flower, delay) {
            const { stem, headGroup, petals, stemHeight } = flower.userData;

            return new Promise(resolve => {
                setTimeout(() => {
                    playGrowSound();

                    const startTime = performance.now();

                    function animate() {
                        const elapsed = performance.now() - startTime;

                        // Stem growth (0-2s)
                        if (elapsed < 2000) {
                            const t = easeOutCubic(elapsed / 2000);
                            stem.scale.y = t;
                            stem.position.y = (stemHeight / 2) * t;
                        } else {
                            stem.scale.y = 1;
                            stem.position.y = stemHeight / 2;
                        }

                        // Disk appears (2-3s)
                        if (elapsed >= 2000 && elapsed < 3000) {
                            const t = easeOutCubic((elapsed - 2000) / 1000);
                            headGroup.scale.set(t, t, t);
                            headGroup.position.y = stemHeight * stem.scale.y;
                        } else if (elapsed >= 3000) {
                            headGroup.scale.set(1, 1, 1);
                        }

                        // Petals bloom (3-4s)
                        if (elapsed >= 3000 && elapsed < 4000) {
                            if (elapsed < 3100) playBloomSound();

                            petals.forEach((petal, i) => {
                                const petalStart = 3000 + i * 30;
                                if (elapsed >= petalStart) {
                                    const petalT = Math.min(1, (elapsed - petalStart) / 300);
                                    const scale = easeOutCubic(petalT);
                                    petal.scale.set(scale, scale, scale);
                                }
                            });
                        } else if (elapsed >= 4000) {
                            petals.forEach(petal => petal.scale.set(1, 1, 1));
                        }

                        if (elapsed < 4500) {
                            requestAnimationFrame(animate);
                        } else {
                            flower.userData.animated = true;
                            resolve();
                        }
                    }

                    animate();
                }, delay);
            });
        }

        async function startBouquetAnimation() {
            isAnimating = true;

            for (let i = 0; i < flowers.length; i++) {
                animateFlower(flowers[i], i * 400);
            }

            // Show final message after all animations
            setTimeout(() => {
                playCheerSound();
                document.getElementById('finalMessage').style.display = 'flex';
                isAnimating = false;
            }, flowers.length * 400 + 4500);
        }

        // Reset flowers
        function resetFlowers() {
            flowers.forEach(flower => {
                const { stem, headGroup, petals } = flower.userData;
                stem.scale.y = 0;
                stem.position.y = 0;
                headGroup.scale.set(0, 0, 0);
                petals.forEach(petal => petal.scale.set(0, 0, 0));
                flower.userData.animated = false;
            });
            bouquet.rotation.x = 0;
            bouquet.rotation.y = 0;
        }

        // Interaction state
        let noAttempts = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // Button handlers
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const questionBox = document.getElementById('questionBox');
        const finalMessage = document.getElementById('finalMessage');
        const sadMessage = document.getElementById('sadMessage');

        btnYes.addEventListener('click', () => {
            initAudio();
            questionBox.style.display = 'none';
            startBouquetAnimation();
        });

        function dodgeNo() {
            if (noAttempts >= 15) return;

            playDodgeSound();
            noAttempts++;

            const maxX = window.innerWidth - btnNo.offsetWidth - 100;
            const maxY = window.innerHeight - btnNo.offsetHeight - 100;

            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;

            btnNo.style.position = 'fixed';
            btnNo.style.left = newX + 'px';
            btnNo.style.top = newY + 'px';
        }

        btnNo.addEventListener('mouseenter', dodgeNo);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (noAttempts >= 15) {
                showSadMessage();
            } else {
                dodgeNo();
            }
        }, { passive: false });

        btnNo.addEventListener('click', () => {
            if (noAttempts >= 15) {
                showSadMessage();
            }
        });

        function showSadMessage() {
            playSadSound();
            questionBox.style.display = 'none';
            btnNo.style.display = 'none';
            sadMessage.style.display = 'flex';
        }

        // Reset buttons
        document.getElementById('btnReset').addEventListener('click', resetAll);
        document.getElementById('btnResetSad').addEventListener('click', resetAll);

        function resetAll() {
            noAttempts = 0;
            resetFlowers();
            finalMessage.style.display = 'none';
            sadMessage.style.display = 'none';
            btnNo.style.position = 'relative';
            btnNo.style.left = '';
            btnNo.style.top = '';
            btnNo.style.display = '';
            questionBox.style.display = '';
        }

        // Drag rotation
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            bouquet.rotation.y += deltaX * 0.005;
            bouquet.rotation.x += deltaY * 0.005;
            bouquet.rotation.x = Math.max(-0.5, Math.min(0.5, bouquet.rotation.x));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('mouseup', () => {
            isDragging = false;
        });

        container.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Touch events
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();

            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            bouquet.rotation.y += deltaX * 0.005;
            bouquet.rotation.x += deltaY * 0.005;
            bouquet.rotation.x = Math.max(-0.5, Math.min(0.5, bouquet.rotation.x));

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: false });

        container.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Render loop
        function render() {
            requestAnimationFrame(render);

            // Idle auto-rotation
            if (!isDragging && !isAnimating) {
                bouquet.rotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        render();
    </script>
</body>
</html>
